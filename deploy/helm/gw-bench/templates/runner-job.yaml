{{- if not .Values.runner.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-runner
  namespace: {{ include "gw-bench.namespace" . }}
  labels:
    {{- include "gw-bench.runnerLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook-weight: "10"
spec:
  schedule: "0 0 31 2 *"  # Never fires; used only as a Job template
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "gw-bench.runnerLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "gw-bench.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.runner.podSecurityContext | nindent 12 }}
          containers:
            - name: runner
              image: {{ include "gw-bench.runnerImage" . }}
              imagePullPolicy: {{ .Values.runner.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                {{- toYaml .Values.runner.securityContext | nindent 16 }}
              command: ["gw-bench", "run"]
              args:
                {{- range .Values.runner.scenarios }}
                - /scenarios/{{ . }}.yaml
                {{- end }}
              env:
                - name: CLUSTER_NAME
                  value: {{ .Values.runner.clusterName | default "" | quote }}
                - name: PROMETHEUS_URL
                  value: {{ .Values.runner.prometheus.url | default "" | quote }}
                - name: LOG_LEVEL
                  value: "info"
              resources:
                {{- toYaml .Values.runner.resources | nindent 16 }}
              volumeMounts:
                - name: scenarios
                  mountPath: /scenarios
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scenarios
              configMap:
                name: {{ .Release.Name }}-scenarios
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
{{- end }}
