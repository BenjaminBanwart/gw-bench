{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ include "gw-bench.namespace" . }}
  labels:
    {{- include "gw-bench.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gw-bench.backendSelectorLabels" . | nindent 4 }}
{{- end }}
