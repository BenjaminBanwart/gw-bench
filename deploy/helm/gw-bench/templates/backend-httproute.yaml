{{- range $name, $gw := .Values.gateways }}
{{- if and $gw.enabled (eq $gw.type "gatewayApi") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ include "gw-bench.namespace" $ }}
  labels:
    {{- include "gw-bench.backendLabels" $ | nindent 4 }}
    gw-bench/gateway: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gw.parentRef.name }}
      namespace: {{ $gw.parentRef.namespace }}
  hostnames:
    - {{ $gw.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $.Release.Name }}-backend
          port: {{ $.Values.backend.port | default 8080 }}
{{- end }}
{{- end }}
