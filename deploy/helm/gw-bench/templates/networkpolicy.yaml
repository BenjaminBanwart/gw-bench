{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ include "gw-bench.namespace" . }}
  labels:
    {{- include "gw-bench.backendLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gw-bench.backendSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from gateway namespaces
    {{- range $name, $gw := .Values.gateways }}
    {{- if $gw.enabled }}
    {{- if and (eq $gw.type "gatewayApi") $gw.parentRef }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gw.parentRef.namespace }}
    {{- end }}
    {{- end }}
    {{- end }}
    # Allow traffic from runner pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: runner
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-runner
  namespace: {{ include "gw-bench.namespace" . }}
  labels:
    {{- include "gw-bench.runnerLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to any (gateway services, Prometheus, log pipeline)
    - to: []
{{- end }}
