apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gw-bench.serviceAccountName" . }}
  namespace: {{ include "gw-bench.namespace" . }}
  labels:
    {{- include "gw-bench.runnerLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "gw-bench.runnerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "gw-bench.runnerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "gw-bench.serviceAccountName" . }}
    namespace: {{ include "gw-bench.namespace" . }}
