backend:
  enabled: true
  image:
    repository: ghcr.io/benjaminbanwart/gw-bench-backend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  affinity: {}
  port: 8080

runner:
  image:
    repository: ghcr.io/benjaminbanwart/gw-bench
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  cronjob:
    enabled: false
    schedule: "0 2 * * 0"
  scenarios:
    - http-small-5k-qps
    - http-medium-payload
    - http-sustained-1k-qps
  prometheus:
    url: ""
  clusterName: ""

gateways: {}

scenarios:
  bundled: true
  custom: {}

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
