apiVersion: gw-bench/v1
kind: Scenario
metadata:
  name: tls-connection-churn
  description: |
    TLS connection churn test. Disables keepalive so every request forces
    a new TCP+TLS handshake through the gateway. Measures TLS termination
    overhead and connection setup latency under moderate load.
spec:
  protocol: http
  loadGenerator: fortio
  duration: 60s
  warmup: 10s
  cooldown: 30s
  targetQPS: 500
  connections: 50
  noKeepAlive: true
  payload:
    method: GET
    path: /echo
    headers:
      X-Test-Run: gw-bench
  gateways:
    - name: agentgateway
      url: https://test.agentgateway.internal/echo
      promPodSelector: 'app.kubernetes.io/name="agentgateway"'
    - name: ingress-nginx
      url: https://test.nginx.internal/echo
      promPodSelector: 'app.kubernetes.io/name="ingress-nginx"'
