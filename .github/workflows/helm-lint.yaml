name: Helm Lint

on:
  push:
    paths:
      - "deploy/helm/**"
  pull_request:
    paths:
      - "deploy/helm/**"

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/gw-bench/

      - name: Helm template
        run: helm template gw-bench deploy/helm/gw-bench/ -f deploy/helm/gw-bench/values.example.yaml
